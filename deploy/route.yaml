# OpenShift Route with TLS edge termination.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maestro-midi-player
  labels:
    app: maestro-midi-player
spec:
  # Set your hostname, or remove it to let OpenShift generate one.
  # host: midi.example.com
  # Subfolder hosting: uncomment and set MAESTRO_BASE_PATH to the same value
  # in deployment.yaml. Routes forward the prefix; the app handles it.
  # path: /midi
  to:
    kind: Service
    name: maestro-midi-player
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
