# Dataset volume. The MAESTRO v3.0.0 MIDI archive is ~60 MB (~85 MB extracted),
# so 3Gi is generous; it's kept at 3Gi because a PVC can't be shrunk in place.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maestro-dataset-pvc
  labels:
    app: maestro-midi-player
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
  # storageClassName: standard
