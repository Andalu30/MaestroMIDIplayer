apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maestro-midi-player
  labels:
    app: maestro-midi-player
spec:
  # Replace with your actual hostname, or remove to let OpenShift auto-generate one.
  # host: midi.example.com
  to:
    kind: Service
    name: maestro-midi-player
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
