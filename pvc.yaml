apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maestro-dataset-pvc
  labels:
    app: maestro-midi-player
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # MAESTRO v3.0.0 MIDI-only archive is ~1.4 GB; the extracted dataset
      # including the CSV is roughly 1.5 GB.
      storage: 3Gi
  # Uncomment and set to a StorageClass available in your cluster:
  # storageClassName: standard
