# Multi-platform deployment manifests for MaestroMIDIplayer.
# Supports both Kubernetes and OpenShift environments.
#
# Kubernetes: Use with kubectl apply -f .
# OpenShift: Use with oc apply -f . or bundle into OperatorHub.
#
# CD via Keel (https://keel.sh):
#   Keel watches GHCR for new image tags and automatically rolls out updates.
#   The annotations below enable policy-based auto-updates — no extra pipeline needed.
#
# Prerequisites:
#   - Keel installed in the cluster (https://keel.sh/docs/#installation) if automatic updates are desired.
#   - A pull-secret for ghcr.io (if the repo is private):
#       kubectl create secret docker-registry ghcr-secret \
#         --docker-server=ghcr.io \
#         --docker-username=<github-user> \
#         --docker-password=<token>
#   - For OpenShift: Create PVCs or use cluster storage classes

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maestro-midi-player
  labels:
    app: maestro-midi-player
  annotations:
    # Keel policy: "semver" → only update when a higher semver tag is pushed.
    # Other options: "all" (every new tag), "force" (always pull latest), "glob:v1.*"
    keel.sh/policy: semver
    # Trigger update approvals via Slack/webhook, or "true" for fully automatic.
    keel.sh/trigger: poll
    # How often Keel polls GHCR for new tags (ignored when using webhooks).
    keel.sh/pollSchedule: "@every 24h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maestro-midi-player
  template:
    metadata:
      labels:
        app: maestro-midi-player
    spec:
      # OpenShift assigns an arbitrary UID from the namespace range at runtime.
      # runAsNonRoot enforces that constraint; we do NOT set runAsUser so
      # OpenShift can inject the namespace UID freely.
      # supplementalGroups: [0] ensures the container process retains GID 0,
      # which matches the GID 0 ownership set in the image (chmod g=u).
      securityContext:
        runAsNonRoot: true
        supplementalGroups:
          - 0
      containers:
        - name: maestro-midi-player
          # Replace with your registry/image:tag
          image: ghcr.io/andalu30/maestromidiplayer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: MAESTRO_ENV
              value: "production"
            - name: MAESTRO_DATASET_PATH
              value: "/data"
            - name: MAESTRO_IMAGE_CACHE_DIR
              value: "/app/backend/.cache/composer_images"
            # Uncomment and set your domain:
            # - name: MAESTRO_CORS_ORIGINS
            #   value: '["https://midi.example.com"]'
          securityContext:
            # Required by OpenShift restricted-v2 SCC
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: dataset
              mountPath: /data
            - name: composer-cache
              mountPath: /app/backend/.cache/composer_images
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: dataset
          persistentVolumeClaim:
            claimName: maestro-dataset-pvc
        - name: composer-cache
          # Use emptyDir to avoid PVC permission issues for the cache.
          # Composer images are re-fetched from Wikipedia after a pod restart.
          # Replace with a PVC if cache persistence across restarts is desired.
          emptyDir: {}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maestro-dataset-pvc
  labels:
    app: maestro-midi-player
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # MAESTRO v3.0.0 MIDI-only archive is ~1.4 GB; the extracted dataset
      # including the CSV is roughly 1.5 GB.
      storage: 3Gi
  # Uncomment and set to a StorageClass available in your cluster:
  # storageClassName: standard

---
apiVersion: v1
kind: Service
metadata:
  name: maestro-midi-player
  labels:
    app: maestro-midi-player
spec:
  selector:
    app: maestro-midi-player
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
