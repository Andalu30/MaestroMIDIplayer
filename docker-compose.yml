services:
  maestro:
    build: .
    # Explicit UID:GID — GID 0 (root group) mirrors the image's file ownership
    # so the same image runs correctly on plain Docker and on OpenShift, where
    # an arbitrary high UID is assigned but the root group (0) is retained.
    user: "1000:0"
    ports:
      - "8000:8000"
    volumes:
      # Primary dataset storage (auto-downloaded on startup if this volume lacks the CSV)
      - maestro-data:/data
      # Persist composer image cache across restarts
      - composer-cache:/app/backend/.cache/composer_images
    environment:
      - MAESTRO_DATASET_PATH=/data
      - MAESTRO_ENV=production
      # Set MAESTRO_CORS_ORIGINS to your deployment domain, e.g.:
      # - MAESTRO_CORS_ORIGINS=["https://midi.example.com"]
    restart: unless-stopped

volumes:
  maestro-data:
  composer-cache:
