services:
  maestro:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persist downloaded dataset across restarts
      - maestro-data:/data
      # Persist composer image cache across restarts
      - composer-cache:/app/backend/.cache/composer_images
    environment:
      - MAESTRO_DATASET_PATH=/data
      - MAESTRO_ENV=production
      # Set MAESTRO_CORS_ORIGINS to your deployment domain, e.g.:
      # - MAESTRO_CORS_ORIGINS=["https://midi.example.com"]
    restart: unless-stopped

volumes:
  maestro-data:
  composer-cache:
