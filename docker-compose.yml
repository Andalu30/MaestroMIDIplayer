services:
  maestro:
    build: .
    # Explicit UID:GID — GID 0 (root group) mirrors the image's file ownership
    # so the same image runs correctly on plain Docker and on OpenShift, where
    # an arbitrary high UID is assigned but the root group (0) is retained.
    user: "1000:0"
    ports:
      - "8000:8000"
    volumes:
      # Primary dataset storage (auto-downloaded on startup if this volume lacks the CSV)
      - maestro-data:/data
      # Persist composer image cache across restarts
      - composer-cache:/app/backend/.cache/composer_images
    environment:
      - MAESTRO_DATASET_PATH=/data
      - MAESTRO_ENV=production
      # Set MAESTRO_CORS_ORIGINS to your deployment domain, e.g.:
      # - MAESTRO_CORS_ORIGINS=["https://midi.example.com"]
      # Serve from a subfolder behind a reverse proxy (https://host/midi/):
      # - MAESTRO_BASE_PATH=/midi
      # Behind a reverse proxy, trust its X-Forwarded-For for per-client rate
      # limiting (its IP/CIDR, or * if port 8000 isn't published directly):
      # - FORWARDED_ALLOW_IPS=172.18.0.0/16
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot downloads the dataset before the server starts
      start_period: 10m
    restart: unless-stopped

volumes:
  maestro-data:
  composer-cache:
